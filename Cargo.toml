[workspace]
members = ["crates/esh-policy", "crates/esh-host", "crates/esh-syntax", "crates/esh-lang", "crates/esh-runtime", "crates/esh-cli", "crates/esh-editor", "crates/esh-web"]
resolver = "2"

[workspace.package]
version = "0.2.0"
edition = "2021"
publish = false

[workspace.dependencies]
esh-policy = { path = "crates/esh-policy" }
esh-syntax = { path = "crates/esh-syntax" }
esh-lang = { path = "crates/esh-lang" }
esh-host = { path = "crates/esh-host" }
esh-runtime = { path = "crates/esh-runtime" }
esh-editor = { path = "crates/esh-editor" }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
rustix = { version = "1", features = ["fs"] }
getrandom = "0.4"
tempfile = "3"
sha2 = "0.11"
tiny_http = "0.12"
