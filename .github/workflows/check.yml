name: Checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read

jobs:
  rust:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt,clippy --target wasm32-unknown-unknown
      - run: cargo +1.98.1 fmt --all --check
      - run: cargo +1.98.1 test --locked --workspace
      - run: cargo +1.98.1 clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo +1.98.1 check --locked -p esh-web --target wasm32-unknown-unknown
      - name: Check the extraction fingerprint with esh
        run: scripts/extract-policy.sh --check-fingerprint
        env:
          RUSTUP_TOOLCHAIN: 1.98.1

  lean:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      MATHLIB_NO_CACHE_ON_UPDATE: '1'
      LEAN_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o "$RUNNER_TEMP/elan-init.sh"
          sh "$RUNNER_TEMP/elan-init.sh" -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Check the reference kernel
        run: lake build
      - name: Check reference regressions
        run: cd reference/python && python3 -B -m unittest discover -s tests -v
      - name: Check extracted Rust proofs
        run: scripts/check-proofs.sh
