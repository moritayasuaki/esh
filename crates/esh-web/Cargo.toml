[package]
name = "esh-web"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
esh-editor.workspace = true
esh-lang.workspace = true
serde_json.workspace = true
wasm-bindgen = "=0.2.130"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "Node", "HtmlElement", "HtmlTextAreaElement", "HtmlAnchorElement", "HtmlButtonElement", "Event", "EventTarget", "KeyboardEvent", "Response", "DomTokenList"] }
